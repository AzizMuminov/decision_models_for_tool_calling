output_dir: results/openrouter_v1
seed: 0
limit_per_category: null
concurrency: 6
budget_usd: null
when2call_path: data/When2Call/data/test/when2call_test_mcq.jsonl
benchmarks:
  bfcl:
    simple_python: 100
    multiple: 100
    live_simple: 100
    live_multiple: 250
    parallel_multiple: 60
    irrelevance: 100
    live_irrelevance: 150
  when2call:
