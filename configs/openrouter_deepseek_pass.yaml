    temperature: 0.0
    extra_body:
      reasoning:
        effort: low
    max_tokens: 2048
dms:
  jev:
    kind: openrouter
    model: typesafe/jev-1.14
  msd1:
    kind: openrouter
    model: microsoft/microsoft-decision-1
  lexical:
    kind: lexical
judge: deepseek
pipeline:
  gate_threshold: 0.5
  cascade_threshold: 0.8
  select_mode: choice
